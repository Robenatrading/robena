name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reconstruiește site-ul zilnic (03:17 ora României), ca produsele
  # adăugate din panoul de administrare să primească pagini proprii
  # și să apară în sitemap fără o publicare manuală.
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Dacă vin mai multe publicări una după alta (de ex. adaugi 5 produse),
# rulează una singură, iar următoarea o preia pe cea mai nouă.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install, build and upload
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Cu multe poze, publicarea poate dura peste 10 minute (limita
          # implicită) și GitHub raportează „failure”. Îi dăm 30 de minute.
          timeout: 1800000

      # Golește automat cache-ul Cloudflare după fiecare publicare,
      # ca toată lumea să vadă imediat varianta nouă a site-ului.
      # Are nevoie de 2 secrete în GitHub: CLOUDFLARE_ZONE_ID și CLOUDFLARE_API_TOKEN.
      - name: Golește cache-ul Cloudflare
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Secretele Cloudflare lipsesc - pasul este sărit."
            exit 0
          fi
          # GitHub Pages are nevoie de câteva secunde să servească varianta nouă
          sleep 30
          raspuns=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$raspuns"
          echo "$raspuns" | grep -q '"success":true' || { echo "Golirea cache-ului a eșuat"; exit 1; }
